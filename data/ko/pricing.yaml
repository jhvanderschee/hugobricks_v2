# ---------------------------------------------------------------------------
# Pricing plans, rendered by the `{{< pricing >}}` shortcode into the `prices`
# brick. The section's own heading and intro stay in the markdown; everything
# below them lives here.
#
# `featured: true` is the plan that is lifted out of the row. Mark exactly one.
# ---------------------------------------------------------------------------

currency: $
period: /월

plans:
  - badge: 저예산
    title: 오픈 소스
    description: 매우 빠르고 훌륭한 웹사이트를 만들 수 있는 완전한 테마/페이지 빌더.
    price: 0
    features:
      - Hugobricks 테마/코드
      - 사용 가능한 모든 브릭
      - 정기 업데이트
      - 버그 수정 및 보안 패치
    cta:
      title: 시작하기
      link: /get-started/
      style: ghost

  - badge: 가장 인기
    title: 호스팅
    description: 올인원 툴킷 — 최고 수준의 인프라에서 웹사이트를 호스팅해 드립니다.
    price: 25
    featured: true
    features:
      - Hugobricks 테마/코드
      - 사용 가능한 모든 브릭
      - 정기 업데이트
      - 버그 수정 및 보안 패치
      - 폼 처리 + 알림
      - 편집자용 CMS
    cta:
      title: 네, 이걸로 할게요!
      link: /get-started/

  - badge: 올인원
    title: 엔터프라이즈
    description: 완전한 제품군으로 뛰어난 가치와 비용 절감을 누리세요.
    price: 75
    features:
      - "다른 모든 기능에 더해:"
      - 우선 지원
      - 테마 맞춤 설정
      - 맞춤 브릭 (요청 시)
    cta:
      title: 문의하기
      link: /get-started/
      style: ghost
