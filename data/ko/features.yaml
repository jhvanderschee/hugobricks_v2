# `features` brick. The section's own heading and intro stay in the markdown;
# the cards live here.
#
# `icon` is any square SVG. It is drawn in the accent colour through a CSS
# mask, so the file's own fill is ignored — a one-colour glyph is what works.
# ---------------------------------------------------------------------------

