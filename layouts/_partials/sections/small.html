{{- /*
  Brick: small
  Narrow single column, used for short forms and short bodies of text.

  @context {dict} . Content, Name, Index, Page
*/ -}}
{{- $label := partial "section_label.html" .Content -}}
<section class="small"{{ with $label }} aria-labelledby="{{ . }}"{{ end }}>
    <div class="container small">
        {{ .Content }}
    </div>
</section>
