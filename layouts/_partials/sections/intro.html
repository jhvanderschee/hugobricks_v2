{{- /*
  Brick: intro
  Centred page opener: h1, lead paragraph, call-to-action, hero illustration.

  @context {dict} . Content, Name, Index, Page
*/ -}}
{{- $label := partial "section_label.html" .Content -}}
<section class="intro"{{ with $label }} aria-labelledby="{{ . }}"{{ end }}>
    <div class="container small">
        {{ .Content }}
    </div>
</section>
