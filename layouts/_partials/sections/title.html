{{- /*
  Brick: title
  Centred page title: breadcrumbs, h1, lead paragraph.

  @context {dict} . Content, Name, Index, Page
*/ -}}
{{- $label := partial "section_label.html" .Content -}}
<section class="title"{{ with $label }} aria-labelledby="{{ . }}"{{ end }}>
    <div class="container small">
        {{ .Content }}
    </div>
</section>
