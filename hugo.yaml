baseURL: https://www.hugobricks2.preview.usecue.com
defaultContentLanguage: en

# The stylesheet is authored under `static/css/`, so that is where Hugo Pipes
# looks for it as well as where the files are served from.
assetDir: static

languages:
  en:
    languageCode: en
    languageName: English
    contentDir: content/en
    weight: 1
  nl:
    languageCode: nl
    languageName: Nederlands
    contentDir: content/nl
    weight: 2

