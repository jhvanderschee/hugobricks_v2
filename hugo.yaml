markup:
  goldmark:
    renderer:
      unsafe: true

disableKinds:
  - taxonomy
  - term

outputs:
  home:
    - html
    - rss
    # `json` (the search index) is added back together with a template when
    # `enable_search` in data/settings.yaml is turned on.
